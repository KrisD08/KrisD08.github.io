# web/nginx.conf — LAB-02
#
# nginx-unprivileged ya escucha en 8080 por defecto; reemplazamos su
# configuración por esta, con dos responsabilidades:
#   1) servir tu perfil estático (index.html, libro-de-visitas.js)
#   2) reenviar TODO lo que llegue a /api/ hacia el servicio "api"
#
# El JavaScript del libro de visitas llama a fetch("/api/..."), sin dominio
# ni puerto: para el navegador, /api/ es del mismo origen que la página.
# Es nginx quien decide, puertas adentro, a quién reenviar eso.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # "api" es el nombre del servicio en compose.yaml: en la red de
        # Docker ese nombre resuelve solo porque están en la misma red
        # definida por el usuario (ver Reto 4). 3000 es el puerto donde
        # escucha la API (nunca lo publicamos hacia el host).
        proxy_pass http://api:3000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
